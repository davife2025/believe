<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="9" fill="url(#grad)"/>
  <!-- Shine overlay -->
  <rect width="32" height="16" rx="9" fill="url(#shine)"/>

  <!-- B letterform - custom geometric -->
  <path
    d="M9 8h7.5c2.5 0 4 1.2 4 3.2 0 1.3-.7 2.3-1.8 2.8 1.4.4 2.3 1.6 2.3 3 0 2.2-1.7 3.6-4.3 3.6H9V8z"
    fill="white"
    fill-opacity="0.95"
  />
  <!-- Inner cutout to make hollow B -->
  <path
    d="M11.5 10.2v3h4.5c.9 0 1.5-.6 1.5-1.5s-.6-1.5-1.5-1.5H11.5z"
    fill="url(#grad)"
  />
  <path
    d="M11.5 15.4v3.2h5c1 0 1.7-.7 1.7-1.6 0-.9-.7-1.6-1.7-1.6H11.5z"
    fill="url(#grad)"
  />

  <!-- Dot accent - represents growth/progress -->
  <circle cx="23" cy="23" r="3" fill="white" fill-opacity="0.9"/>
</svg>
